
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Vibe — Connect with your people</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #f6f7fb; color: #172033;
      font: 15px Arial, sans-serif;
    }
    header {
      background: white; padding: 17px 20px; border-bottom: 1px solid #e5e7eb;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 2;
    }
    .brand { font-size: 26px; font-weight: 800; color: #635bff; }
    main { max-width: 620px; margin: 24px auto; padding: 0 14px; }
    .card {
      background: white; border: 1px solid #e8eaf0; border-radius: 16px;
      padding: 20px; margin-bottom: 16px;
    }
    h2 { margin-top: 0; }
    input, textarea {
      width: 100%; padding: 13px; margin: 7px 0 12px;
      border: 1px solid #d8dce5; border-radius: 10px;
      font: inherit; background: white; color: #172033;
    }
    textarea { resize: vertical; min-height: 90px; }
    button {
      padding: 12px 16px; border: 0; border-radius: 10px;
      background: #635bff; color: white; font-weight: 700;
      cursor: pointer; margin: 3px 4px 3px 0;
    }
    button:disabled { opacity: .6; }
    button.secondary { background: #eef0ff; color: #5148e5; }
    button.danger { background: #fff0f0; color: #bd3030; }
    .muted { color: #737b8c; font-size: 13px; }
    .hidden { display: none !important; }
    #status {
      padding: 12px; border-radius: 10px; margin-bottom: 14px;
      background: #eef0ff; color: #3730a3; overflow-wrap: anywhere;
    }
    #status.error { background: #fff0f0; color: #a51d1d; }
    .post { white-space: pre-wrap; overflow-wrap: anywhere; margin: 15px 0; }
    .post-head { display: flex; justify-content: space-between; gap: 8px; }
    .post-actions { border-top: 1px solid #eee; padding-top: 10px; }
    .comment { padding: 9px; background: #f7f8fc; border-radius: 8px; margin: 7px 0; }
    .profile-name { font-size: 19px; font-weight: 700; }
    footer { text-align: center; padding: 25px; color: #858b99; }
  </style>
</head>
<body>
<header>
  <div class="brand">Vibe.</div>
  <button id="logoutBtn" class="secondary hidden">Log out</button>
</header>

<main>
  <div id="status" role="status">Starting Vibe…</div>

  <section id="authCard" class="card">
    <h2>Welcome to Vibe 👋</h2>
    <p class="muted">Connect with your people.</p>
    <form id="authForm">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email"
        placeholder="you@example.com" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password"
        placeholder="At least 6 characters" minlength="6" required>
      <button id="loginBtn" type="submit">Log in</button>
      <button id="signupBtn" type="button" class="secondary">Create account</button>
    </form>
    <p class="muted">If email confirmation is enabled, confirm your email before logging in.</p>
  </section>

  <section id="appArea" class="hidden">
    <section class="card">
      <h2>Your profile</h2>
      <div id="profileName" class="profile-name"></div>
      <form id="profileForm">
        <label for="displayName">Display name</label>
        <input id="displayName" maxlength="60" required>
        <label for="username">Username</label>
        <input id="username" maxlength="30" pattern="[A-Za-z0-9_]+"
          title="Use letters, numbers, and underscores" required>
        <label for="bio">Bio</label>
        <textarea id="bio" maxlength="160" placeholder="Tell people about yourself"></textarea>
        <button type="submit">Save profile</button>
      </form>
    </section>

    <section class="card">
      <h2>Create a post</h2>
      <form id="postForm">
        <textarea id="postText" maxlength="2000"
          placeholder="What's on your mind?" required></textarea>
        <button type="submit">Publish post</button>
      </form>
    </section>

    <section>
      <h2>Your feed</h2>
      <div id="feed"></div>
    </section>
  </section>
</main>
<footer>Vibe · Your people, your space.</footer>

<script>
(function () {
  "use strict";

  const SUPABASE_URL = "https://nmslfnhbqprwpsxacuvy.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Snp3A0a0m_2HNCQwi2uR1g_RQ6id2uH";

  const $ = id => document.getElementById(id);
  let supabase = null;
  let currentUser = null;
  let currentProfile = null;
  let busy = false;

  function status(message, isError = false) {
    $("status").textContent = message;
    $("status").classList.toggle("error", isError);
    $("status").classList.remove("hidden");
  }

  function showApp(signedIn) {
    $("authCard").classList.toggle("hidden", signedIn);
    $("appArea").classList.toggle("hidden", !signedIn);
    $("logoutBtn").classList.toggle("hidden", !signedIn);
  }

  function setBusy(value) {
    busy = value;
    document.querySelectorAll("button").forEach(button => {
      button.disabled = value;
    });
  }

  function friendlyError(error) {
    const message = error && error.message ? error.message : String(error);
    console.error("Vibe error:", error);
    status(message, true);
  }

  async function runTask(task) {
    if (busy) return;
    setBusy(true);
    try {
      await task();
    } catch (error) {
      friendlyError(error);
    } finally {
      setBusy(false);
    }
  }

  function make(tag, text, className) {
    const element = document.createElement(tag);
    if (text !== undefined) element.textContent = text;
    if (className) element.className = className;
    return element;
  }

  async function loadProfile() {
    const { data, error } = await supabase
      .from("profiles")
      .select("*")
      .eq("id", currentUser.id)
      .maybeSingle();

    if (error) throw error;

    if (!data) {
      const base = (currentUser.email || "vibeuser")
        .split("@")[0].toLowerCase().replace(/[^a-z0-9_]/g, "")
        .slice(0, 18) || "vibeuser";
      const profile = {
        id: currentUser.id,
        username: base + "_" + currentUser.id.slice(0, 5),
        display_name: base,
        bio: "",
        created_at: new Date().toISOString()
      };

      const result = await supabase.from("profiles")
        .upsert(profile, { onConflict: "id" })
        .select().single();

      if (result.error) throw result.error;
      currentProfile = result.data;
    } else {
      currentProfile = data;
    }

    $("profileName").textContent =
      currentProfile.display_name || currentProfile.username;
    $("displayName").value = currentProfile.display_name || "";
    $("username").value = currentProfile.username || "";
    $("bio").value = currentProfile.bio || "";
  }

  async function loadFeed() {
    $("feed").replaceChildren(make("p", "Loading posts…", "muted"));

    const { data: posts, error } = await supabase
      .from("posts")
      .select("*")
      .order("created_at", { ascending: false })
      .limit(50);

    if (error) throw error;

    if (!posts || posts.length === 0) {
      $("feed").replaceChildren(make("div",
        "No posts yet. Be the first to share something!", "card muted"));
      return;
    }

    const ids = posts.map(post => post.id);
    const { data: profiles, error: profileError } = await supabase
      .from("profiles").select("id,username,display_name").in(
        "id", [...new Set(posts.map(post => post.user_id))]
      );

    if (profileError) throw profileError;

    const profileMap = Object.fromEntries(
      (profiles || []).map(profile => [profile.id, profile])
    );

    const { data: likes, error: likesError } = await supabase
      .from("likes").select("post_id,user_id").in("post_id", ids);

    if (likesError) throw likesError;

    const { data: comments, error: commentsError } = await supabase
      .from("comments").select("*").in("post_id", ids)
      .order("created_at", { ascending: true });

    if (commentsError) throw commentsError;

    const commentProfiles = [...new Set((comments || []).map(c => c.user_id))];
    let commentProfileMap = {};
    if (commentProfiles.length) {
      const { data: cps, error: cpError } = await supabase
        .from("profiles").select("id,username,display_name")
        .in("id", commentProfiles);
      if (cpError) throw cpError;
      commentProfileMap = Object.fromEntries(
        (cps || []).map(p => [p.id, p])
      );
    }

    const fragment = document.createDocumentFragment();

    posts.forEach(post => {
      const author = profileMap[post.user_id];
      const card = make("article", undefined, "card");
      const head = make("div", undefined, "post-head");
      const authorName = author
        ? (author.display_name || author.username)
        : "Vibe user";

      head.append(make("strong", authorName));
      head.append(make("span", new Date(post.created_at).toLocaleString(),
        "muted"));
      card.append(head);

      card.append(make("div", post.content || post.body || "", "post"));

      const postLikes = (likes || []).filter(l => l.post_id === post.id);
      const liked = postLikes.some(l => l.user_id === currentUser.id);
      const actions = make("div", undefined, "post-actions");
      const likeButton = make("button",
        (liked ? "♥ Liked" : "♡ Like") + " (" + postLikes.length + ")");
      likeButton.className = "secondary";
      likeButton.type = "button";
      likeButton.addEventListener("click", () => runTask(async () => {
        if (liked) {
          const { error } = await supabase.from("likes").delete()
            .eq("post_id", post.id).eq("user_id", currentUser.id);
          if (error) throw error;
        } else {
          const { error } = await supabase.from("likes").insert({
            post_id: post.id, user_id: currentUser.id
          });
          if (error) throw error;
        }
        await loadFeed();
        status("Like updated.");
      }));
      actions.append(likeButton);
      card.append(actions);

      const postComments = (comments || []).filter(
        c => c.post_id === post.id
      );
      const commentArea = make("div");
      postComments.forEach(comment => {
        const cp = commentProfileMap[comment.user_id];
        const name = cp ? (cp.display_name || cp.username) : "User";
        commentArea.append(make("div",
          name + ": " + (comment.content || comment.body || ""),
          "comment"));
      });
      card.append(commentArea);

      const commentForm = make("form");
      const commentInput = make("input");
      commentInput.placeholder = "Write a comment…";
      commentInput.maxLength = 1000;
      commentInput.required = true;
      commentForm.append(commentInput);
      const commentButton = make("button", "Comment");
      commentButton.type = "submit";
      commentForm.append(commentButton);
      commentForm.addEventListener("submit", event => {
        event.preventDefault();
        runTask(async () => {
          const { error } = await supabase.from("comments").insert({
            post_id: post.id,
            user_id: currentUser.id,
            content: commentInput.value.trim()
          });
          if (error) throw error;
          await loadFeed();
          status("Comment published.");
        });
      });
      card.append(commentForm);
      fragment.append(card);
    });

    $("feed").replaceChildren(fragment);
  }

  $("authForm").addEventListener("submit", event => {
    event.preventDefault();
    runTask(async () => {
      const email = $("email").value.trim();
      const password = $("password").value;

      status("Logging in…");
      const { data, error } = await supabase.auth.signInWithPassword({
        email, password
      });

      if (error) throw error;
      currentUser = data.user;
      await openUser();
      status("Welcome back to Vibe!");
    });
  });

  $("signupBtn").addEventListener("click", () => runTask(async () => {
    const email = $("email").value.trim();
    const password = $("password").value;
    if (!email || password.length < 6) {
      status("Enter a valid email and a password of at least 6 characters.", true);
      return;
    }

    status("Creating your account…");
    const { data, error } = await supabase.auth.signUp({
      email, password,
      options: {
        emailRedirectTo: location.origin
      }
    });

    if (error) throw error;

    if (data.session && data.user) {
      currentUser = data.user;
      await openUser();
      status("Account created. Welcome to Vibe!");
    } else {
      status("Account created! Check your email for the confirmation link, then return here and log in.");
    }
  }));

  $("profileForm").addEventListener("submit", event => {
    event.preventDefault();
    runTask(async () => {
      const username = $("username").value.trim().toLowerCase();
      const display_name = $("displayName").value.trim();
      const bio = $("bio").value.trim();

      if (!/^[a-z0-9_]{3,30}$/.test(username)) {
        status("Username must be 3–30 characters: letters, numbers, underscores.", true);
        return;
      }

      const { data, error } = await supabase.from("profiles").upsert({
        id: currentUser.id, username, display_name, bio
      }, { onConflict: "id" }).select().single();

      if (error) throw error;
      currentProfile = data;
      $("profileName").textContent = display_name;
      status("Profile saved!");
    });
  });

  $("postForm").addEventListener("submit", event => {
    event.preventDefault();
    runTask(async () => {
      const content = $("postText").value.trim();
      if (!content) return;
      status("Publishing post…");

      const { error } = await supabase.from("posts").insert({
        user_id: currentUser.id,
        content
      });

      if (error) throw error;
      $("postText").value = "";
      await loadFeed();
      status("Your post is live!");
    });
  });

  $("logoutBtn").addEventListener("click", () => runTask(async () => {
    const { error } = await supabase.auth.signOut();
    if (error) throw error;
    currentUser = null;
    currentProfile = null;
    showApp(false);
    status("You have logged out.");
  }));

  async function openUser() {
    showApp(true);
    await loadProfile();
    await loadFeed();
  }

  async function start() {
    status("Loading Supabase library…");

    if (!window.supabase || !window.supabase.createClient) {
      throw new Error(
        "Supabase library did not load. Check your internet connection, then reload the page."
      );
    }

    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    status("Connecting to Vibe…");

    const { data, error } = await supabase.auth.getSession();
    if (error) throw error;

    if (data.session && data.session.user) {
      currentUser = data.session.user;
      await openUser();
      status("Welcome back to Vibe!");
    } else {
      showApp(false);
      status("Ready. Log in or create your account.");
    }

    supabase.auth.onAuthStateChange((_event, session) => {
      if (session && session.user && !currentUser) {
        currentUser = session.user;
        openUser().catch(friendlyError);
      }
    });
  }

  window.addEventListener("error", event => {
    status("JavaScript error: " + (event.message || "Unknown error"), true);
  });

  window.addEventListener("unhandledrejection", event => {
    const reason = event.reason;
    status("App error: " + (reason && reason.message
      ? reason.message : String(reason)), true);
  });

  // Load Supabase first, then start the app.
  const library = document.createElement("script");
  library.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
  library.onload = () => start().catch(friendlyError);
  library.onerror = () => status(
    "Could not load Supabase. Check your connection or CDN access and reload.",
    true
  );
  document.head.appendChild(library);
})();
</script>
</body>
</html>

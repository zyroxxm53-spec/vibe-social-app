<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vibe</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #000; --surface: #121212; --border: #262626;
      --text: #f5f5f5; --muted: #a8a8a8; --accent: #ff3040; --blue: #0095f6;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      max-width: 470px; margin: 0 auto; min-height: 100vh;
      position: relative; overflow-x: hidden;
    }

    /* Header */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(0,0,0,0.9); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
    }
    .logo {
      font-size: 28px; font-weight: 700; letter-spacing: -1px;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-icons { display: flex; gap: 22px; }
    .header-icons svg { width: 24px; height: 24px; cursor: pointer; }

    /* Stories */
    .stories {
      display: flex; gap: 14px; padding: 14px 16px;
      overflow-x: auto; border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .stories::-webkit-scrollbar { display: none; }
    .story { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; cursor: pointer; }
    .story-ring {
      width: 66px; height: 66px; border-radius: 50%; padding: 3px;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    }
    .story-ring.seen { background: #333; }
    .story-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #000; }
    .story-name { font-size: 12px; max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Feed */
    .feed { padding-bottom: 90px; }
    .post { border-bottom: 1px solid var(--border); margin-bottom: 4px; }
    .post-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
    .post-user { display: flex; align-items: center; gap: 12px; }
    .post-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    .post-username { font-weight: 600; font-size: 14px; }
    .post-location { font-size: 12px; color: var(--muted); }
    .post-image {
      width: 100%; aspect-ratio: 1; object-fit: cover; background: #1a1a1a;
      display: block; cursor: pointer; user-select: none;
    }
    .post-actions { display: flex; justify-content: space-between; padding: 12px 16px 6px; }
    .post-actions-left { display: flex; gap: 16px; }
    .action-btn {
      background: none; border: none; color: var(--text); cursor: pointer; padding: 0;
    }
    .action-btn svg { width: 24px; height: 24px; transition: transform 0.15s; }
    .action-btn:active svg { transform: scale(0.85); }
    .action-btn.liked svg { fill: var(--accent); stroke: var(--accent); }
    .likes { font-weight: 600; font-size: 14px; padding: 0 16px 4px; }
    .caption { padding: 0 16px 6px; font-size: 14px; line-height: 1.4; }
    .caption strong { font-weight: 600; margin-right: 6px; }
    .comments-link { color: var(--muted); font-size: 14px; padding: 0 16px 4px; cursor: pointer; }
    .timestamp { color: var(--muted); font-size: 11px; text-transform: uppercase; padding: 0 16px 14px; }

    /* Comment section */
    .comments-box { padding: 0 16px 12px; display: none; }
    .comments-box.show { display: block; }
    .comment { font-size: 14px; margin-bottom: 6px; }
    .comment strong { margin-right: 6px; }
    .add-comment {
      display: flex; gap: 8px; margin-top: 8px;
    }
    .add-comment input {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 8px 14px; color: var(--text); font-size: 14px; outline: none;
    }
    .add-comment button {
      background: none; border: none; color: var(--blue); font-weight: 600; cursor: pointer;
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 470px;
      background: rgba(0,0,0,0.95); backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; align-items: center;
      padding: 10px 0 22px; z-index: 100;
    }
    .nav-item {
      background: none; border: none; color: var(--text); cursor: pointer; padding: 8px;
      display: flex; flex-direction: column; align-items: center;
    }
    .nav-item svg { width: 26px; height: 26px; }
    .nav-avatar {
      width: 26px; height: 26px; border-radius: 50%; object-fit: cover;
      border: 1.5px solid transparent;
    }
    .nav-item.active .nav-avatar { border-color: #fff; }

    /* Pages */
    .page { display: none; }
    .page.active { display: block; }

    /* Explore */
    .explore-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; padding-bottom: 90px;
    }
    .explore-grid img {
      width: 100%; aspect-ratio: 1; object-fit: cover; cursor: pointer;
    }

    /* Profile */
    .profile-header { padding: 20px 16px; text-align: center; }
    .profile-avatar {
      width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin-bottom: 12px;
    }
    .profile-name { font-size: 20px; font-weight: 700; }
    .profile-bio { color: var(--muted); margin: 6px 0 16px; font-size: 14px; }
    .profile-stats {
      display: flex; justify-content: center; gap: 32px; margin-bottom: 16px;
    }
    .stat { text-align: center; }
    .stat-num { font-weight: 700; font-size: 16px; }
    .stat-label { font-size: 13px; color: var(--muted); }
    .edit-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 7px 24px; border-radius: 8px; font-weight: 600; cursor: pointer;
    }

    /* Create */
    .create-area {
      padding: 20px 16px; text-align: center; padding-bottom: 100px;
    }
    .create-preview {
      width: 100%; max-height: 360px; object-fit: contain; background: #111;
      border-radius: 12px; margin-bottom: 16px; display: none;
    }
    .create-preview.show { display: block; }
    .upload-btn {
      background: var(--blue); color: white; border: none;
      padding: 12px 28px; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer;
    }
    .caption-input {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px; color: var(--text); font-size: 15px;
      margin: 16px 0; resize: none; outline: none; min-height: 80px;
    }
    .post-btn {
      background: var(--blue); color: white; border: none;
      padding: 12px 0; width: 100%; border-radius: 10px; font-weight: 600; font-size: 15px;
      cursor: pointer; opacity: 0.5; pointer-events: none;
    }
    .post-btn.active { opacity: 1; pointer-events: auto; }

    /* Empty states */
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">Vibe</div>
    <div class="header-icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </div>
  </header>

  <!-- HOME PAGE -->
  <div id="home" class="page active">
    <div class="stories" id="stories"></div>
    <div class="feed" id="feed"></div>
  </div>

  <!-- EXPLORE PAGE -->
  <div id="explore" class="page">
    <div class="explore-grid" id="exploreGrid"></div>
  </div>

  <!-- CREATE PAGE -->
  <div id="create" class="page">
    <div class="create-area">
      <img id="createPreview" class="create-preview" />
      <input type="file" id="imageInput" accept="image/*" hidden />
      <button class="upload-btn" onclick="document.getElementById('imageInput').click()">Choose Photo</button>
      <textarea id="captionInput" class="caption-input" placeholder="Write a caption..."></textarea>
      <button class="post-btn" id="postBtn" onclick="createPost()">Share</button>
    </div>
  </div>

  <!-- PROFILE PAGE -->
  <div id="profile" class="page">
    <div class="profile-header">
      <img class="profile-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200&h=200&fit=crop" alt="you">
      <div class="profile-name">you</div>
      <div class="profile-bio">Building the next vibe ✨</div>
      <div class="profile-stats">
        <div class="stat"><div class="stat-num" id="postCount">0</div><div class="stat-label">Posts</div></div>
        <div class="stat"><div class="stat-num">128</div><div class="stat-label">Followers</div></div>
        <div class="stat"><div class="stat-num">94</div><div class="stat-label">Following</div></div>
      </div>
      <button class="edit-btn">Edit profile</button>
    </div>
    <div class="explore-grid" id="profileGrid"></div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-page="home">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <button class="nav-item" data-page="explore">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button class="nav-item" data-page="create">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    </button>
    <button class="nav-item" data-page="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    </button>
    <button class="nav-item" data-page="profile">
      <img class="nav-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&h=100&fit=crop" alt="profile">
    </button>
  </nav>

<script>
  // ========== DATA ==========
  let posts = JSON.parse(localStorage.getItem('vibe_posts')) || [
    {
      id: 1,
      user: "sarah_j",
      avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&h=100&fit=crop",
      location: "Lagos, Nigeria",
      image: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=800&h=800&fit=crop",
      likes: 1284,
      liked: false,
      caption: "Golden hour hits different in Lagos ✨ Who else is chasing sunsets this week?",
      comments: [
        { user: "alex.dev", text: "This is fire 🔥" },
        { user: "maya.k", text: "Need this energy" }
      ],
      time: "2 hours ago"
    },
    {
      id: 2,
      user: "alex.dev",
      avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop",
      location: "San Francisco",
      image: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=800&h=800&fit=crop",
      likes: 3891,
      liked: false,
      caption: "New setup is finally complete 🖥️ Building the next big thing one line of code at a time.",
      comments: [],
      time: "5 hours ago"
    },
    {
      id: 3,
      user: "maya.k",
      avatar: "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=100&h=100&fit=crop",
      location: "Bali",
      image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&h=800&fit=crop",
      likes: 8402,
      liked: false,
      caption: "Paradise found 🌴 Currently living my best life. No plans, just vibes.",
      comments: [{ user: "you", text: "Take me with you 😩" }],
      time: "1 day ago"
    }
  ];

  const stories = [
    { name: "Your story", img: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&h=150&fit=crop", seen: false },
    { name: "sarah_j", img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&h=150&fit=crop", seen: false },
    { name: "alex.dev", img: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&h=150&fit=crop", seen: false },
    { name: "maya.k", img: "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=150&h=150&fit=crop", seen: true },
    { name: "jordan", img: "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=150&h=150&fit=crop", seen: false },
    { name: "luna", img: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=150&h=150&fit=crop", seen: false }
  ];

  // ========== RENDER ==========
  function save() {
    localStorage.setItem('vibe_posts', JSON.stringify(posts));
  }

  function renderStories() {
    document.getElementById('stories').innerHTML = stories.map(s => `
      <div class="story">
        <div class="story-ring ${s.seen ? 'seen' : ''}">
          <img class="story-img" src="\( {s.img}" alt=" \){s.name}">
        </div>
        <span class="story-name">${s.name}</span>
      </div>
    `).join('');
  }

  function renderFeed() {
    const feed = document.getElementById('feed');
    if (posts.length === 0) {
      feed.innerHTML = `<div class="empty">No posts yet. Create the first one!</div>`;
      return;
    }
    feed.innerHTML = posts.map(p => `
      <article class="post" data-id="${p.id}">
        <div class="post-header">
          <div class="post-user">
            <img class="post-avatar" src="\( {p.avatar}" alt=" \){p.user}">
            <div>
              <div class="post-username">${p.user}</div>
              <div class="post-location">${p.location || ''}</div>
            </div>
          </div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
          </svg>
        </div>
        <img class="post-image" src="\( {p.image}" alt="post" ondblclick="likePost( \){p.id})">
        <div class="post-actions">
          <div class="post-actions-left">
            <button class="action-btn like-btn \( {p.liked ? 'liked' : ''}" onclick="likePost( \){p.id})">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
            </button>
            <button class="action-btn" onclick="toggleComments(${p.id})">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
            </button>
            <button class="action-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
          <button class="action-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
            </svg>
          </button>
        </div>
        <div class="likes">${p.likes.toLocaleString()} likes</div>
        <div class="caption"><strong>\( {p.user}</strong> \){p.caption}</div>
        <div class="comments-link" onclick="toggleComments(${p.id})">
          ${p.comments.length ? `View all ${p.comments.length} comments` : 'Add a comment...'}
        </div>
        <div class="comments-box" id="comments-${p.id}">
          \( {p.comments.map(c => `<div class="comment"><strong> \){c.user}</strong>${c.text}</div>`).join('')}
          <div class="add-comment">
            <input type="text" placeholder="Add a comment..." id="input-\( {p.id}" onkeypress="if(event.key==='Enter') addComment( \){p.id})">
            <button onclick="addComment(${p.id})">Post</button>
          </div>
        </div>
        <div class="timestamp">${p.time}</div>
      </article>
    `).join('');
  }

  function renderExplore() {
    document.getElementById('exploreGrid').innerHTML = posts.map(p => 
      `<img src="${p.image}" alt="post" onclick="switchPage('home')">`
    ).join('');
  }

  function renderProfile() {
    const myPosts = posts.filter(p => p.user === 'you');
    document.getElementById('postCount').textContent = myPosts.length;
    document.getElementById('profileGrid').innerHTML = myPosts.length 
      ? myPosts.map(p => `<img src="${p.image}" alt="post">`).join('')
      : `<div class="empty" style="grid-column:1/-1">No posts yet</div>`;
  }

  // ========== ACTIONS ==========
  function likePost(id) {
    const post = posts.find(p => p.id === id);
    if (!post) return;
    post.liked = !post.liked;
    post.likes += post.liked ? 1 : -1;
    save();
    renderFeed();
  }

  function toggleComments(id) {
    const box = document.getElementById(`comments-${id}`);
    box.classList.toggle('show');
  }

  function addComment(id) {
    const input = document.getElementById(`input-${id}`);
    const text = input.value.trim();
    if (!text) return;
    const post = posts.find(p => p.id === id);
    post.comments.push({ user: 'you', text });
    input.value = '';
    save();
    renderFeed();
    document.getElementById(`comments-${id}`).classList.add('show');
  }

  // Create post
  let selectedImage = null;
  document.getElementById('imageInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      selectedImage = ev.target.result;
      const preview = document.getElementById('createPreview');
      preview.src = selectedImage;
      preview.classList.add('show');
      document.getElementById('postBtn').classList.add('active');
    };
    reader.readAsDataURL(file);
  });

  function createPost() {
    if (!selectedImage) return;
    const caption = document.getElementById('captionInput').value.trim() || 'New post ✨';
    posts.unshift({
      id: Date.now(),
      user: 'you',
      avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&h=100&fit=crop',
      location: 'Your location',
      image: selectedImage,
      likes: 0,
      liked: false,
      caption,
      comments: [],
      time: 'Just now'
    });
    save();
    selectedImage = null;
    document.getElementById('createPreview').classList.remove('show');
    document.getElementById('captionInput').value = '';
    document.getElementById('postBtn').classList.remove('active');
    document.getElementById('imageInput').value = '';
    switchPage('home');
    renderFeed();
    renderProfile();
  }

  // Navigation
  function switchPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(page).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelector(`.nav-item[data-page="${page}"]`)?.classList.add('active');
  }
  document.querySelectorAll('.nav-item[data-page]').forEach(item => {
  item.addEventListener('click', () => switchPage(item.dataset.page));
});

renderStories();
renderFeed();
renderExplore();
renderProfile();
</script>
</body>
</html>

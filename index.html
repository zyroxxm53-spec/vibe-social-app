
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Vibe — Connect your world</title>
<style>
:root{--blue:#5145e5;--bg:#f7f8fc;--text:#191a24;--muted:#777b8c;--line:#e8eaf1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:11px;padding:11px 15px;background:var(--blue);color:white;font-weight:600}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--text);margin:6px 0 12px}
header{position:sticky;top:0;background:white;border-bottom:1px solid var(--line);padding:15px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-size:29px;font-weight:900;color:var(--blue)}
main{max-width:650px;margin:22px auto;padding:0 14px 80px}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:15px}
.muted{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
#notice{margin:10px 0;color:var(--blue);overflow-wrap:anywhere}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e9e7ff;color:var(--blue);font-weight:bold;flex-shrink:0}
.post-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:10px}
footer button{background:white;color:#555;flex:1;max-width:150px}
</style>
</head>
<body>
<header>
  <div class="logo">vibe.</div>
  <div id="accountLabel" class="muted">Your social space</div>
</header>

<main>
  <div id="notice" role="status"></div>

  <section id="authCard" class="card">
    <h2>Welcome to Vibe</h2>
    <p class="muted">Create an account or log in to share with your community.</p>
    <form id="authForm">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <label for="password">Password</label>
      <input id="password" type="password" minlength="6" autocomplete="current-password" placeholder="At least 6 characters" required>
      <button id="loginBtn" type="submit">Log in</button>
      <button id="signupBtn" type="button">Create account</button>
    </form>
  </section>

  <section id="appArea" class="hidden">
    <div class="card">
      <h2>What's happening?</h2>
      <form id="postForm">
        <textarea id="postContent" maxlength="2000" placeholder="Share something with your people..." required></textarea>
        <button id="publishBtn" type="submit">Share post</button>
      </form>
    </div>

    <div class="card">
      <h2>Your feed</h2>
      <input id="searchInput" type="search" placeholder="Search posts or usernames...">
      <button id="refreshBtn" type="button">Refresh feed</button>
    </div>

    <div id="feed"></div>

    <div class="card">
      <h2>Your account</h2>
      <p id="profileInfo" class="muted"></p>
      <button id="logoutBtn" type="button">Log out</button>
    </div>
  </section>
</main>

<footer>
  <button id="homeBtn" type="button">Home</button>
  <button id="searchBtn" type="button">Search</button>
  <button id="profileBtn" type="button">Profile</button>
</footer>

<script type="module">
import { createClient } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://nmslfnhbqprwpsxacuvy.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Snp3A0a0m_2HNCQwi2uR1g_RQ6id2uH";

const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const $ = id => document.getElementById(id);
let currentUser = null;
let allPosts = [];

function notice(message, error = false) {
  $("notice").textContent = message;
  $("notice").style.color = error ? "#c0392b" : "#27834a";
}

function escapeHTML(value = "") {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

async function updateScreen() {
  const {data, error} = await supabase.auth.getSession();
  if (error) return notice(error.message, true);

  currentUser = data.session?.user || null;
  $("authCard").classList.toggle("hidden", !!currentUser);
  $("appArea").classList.toggle("hidden", !currentUser);
  $("accountLabel").textContent = currentUser ? currentUser.email : "Your social space";

  if (currentUser) {
    $("profileInfo").textContent = "Signed in as " + currentUser.email;
    await loadFeed();
  }
}

async function signUp() {
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || password.length < 6) {
    return notice("Enter a valid email and a password of at least 6 characters.", true);
  }

  $("signupBtn").disabled = true;
  notice("Creating your account...");

  try {
    const {data, error} = await supabase.auth.signUp({email, password});
    if (error) throw error;

    if (data.session) {
      notice("Account created! Welcome to Vibe.");
      await updateScreen();
    } else {
      notice("Account created. Check your email for a confirmation link, then log in.");
    }
  } catch (e) {
    notice(e.message || "Account creation failed.", true);
  } finally {
    $("signupBtn").disabled = false;
  }
}

async function signIn(event) {
  event.preventDefault();
  $("loginBtn").disabled = true;
  notice("Logging in...");

  try {
    const {error} = await supabase.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("password").value
    });
    if (error) throw error;
    notice("Logged in successfully!");
    await updateScreen();
  } catch (e) {
    notice(e.message || "Login failed.", true);
  } finally {
    $("loginBtn").disabled = false;
  }
}

async function loadFeed() {
  $("feed").textContent = "Loading posts...";

  try {
    const {data, error} = await supabase
      .from("posts")
      .select("id,user_id,content,created_at,profiles(username,display_name)")
      .order("created_at", {ascending:false})
      .limit(50);

    if (error) throw error;
    allPosts = data || [];
    renderFeed();
  } catch (e) {
    $("feed").textContent = "";
    const box = document.createElement("div");
    box.className = "card";
    box.textContent = "Could not load posts: " + e.message;
    $("feed").appendChild(box);
  }
}

function renderFeed() {
  const query = $("searchInput").value.trim().toLowerCase();
  const posts = allPosts.filter(post => {
    const profile = Array.isArray(post.profiles) ? post.profiles[0] : post.profiles;
    return (post.content || "").toLowerCase().includes(query) ||
      (profile?.username || "").toLowerCase().includes(query) ||
      (profile?.display_name || "").toLowerCase().includes(query);
  });

  $("feed").innerHTML = "";

  if (!posts.length) {
    const box = document.createElement("div");
    box.className = "card muted";
    box.textContent = query ? "No matching posts found." : "No posts yet. Be the first to share!";
    $("feed").appendChild(box);
    return;
  }

  posts.forEach(post => {
    const profile = Array.isArray(post.profiles) ? post.profiles[0] : post.profiles;
    const name = profile?.display_name || profile?.username || "Vibe user";
    const card = document.createElement("article");
    card.className = "card";

    const head = document.createElement("div");
    head.className = "post-head";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = name.charAt(0).toUpperCase();

    const details = document.createElement("div");
    const title = document.createElement("strong");
    title.textContent = name;
    const username = document.createElement("div");
    username.className = "muted";
    username.textContent = "@" + (profile?.username || "user");
    details.append(title, username);
    head.append(avatar, details);

    const content = document.createElement("p");
    content.className = "post-text";
    content.textContent = post.content || "";

    const time = document.createElement("div");
    time.className = "muted";
    time.textContent = new Date(post.created_at).toLocaleString();

    card.append(head, content, time);
    $("feed").appendChild(card);
  });
}

async function createPost(event) {
  event.preventDefault();
  if (!currentUser) return notice("Please log in first.", true);

  const content = $("postContent").value.trim();
  if (!content) return notice("Write something before posting.", true);

  $("publishBtn").disabled = true;

  try {
    const {error} = await supabase.from("posts").insert({
      user_id: currentUser.id,
      content
    });
    if (error) throw error;

    $("postContent").value = "";
    notice("Your post has been published!");
    await loadFeed();
  } catch (e) {
    notice(e.message || "Could not publish post.", true);
  } finally {
    $("publishBtn").disabled = false;
  }
}

async function logOut() {
  const {error} = await supabase.auth.signOut();
  if (error) return notice(error.message, true);
  currentUser = null;
  allPosts = [];
  $("feed").innerHTML = "";
  notice("You have logged out.");
  await updateScreen();
}

$("authForm").addEventListener("submit", signIn);
$("signupBtn").addEventListener("click", signUp);
$("postForm").addEventListener("submit", createPost);
$("refreshBtn").addEventListener("click", loadFeed);
$("searchInput").addEventListener("input", renderFeed);
$("logoutBtn").addEventListener("click", logOut);
$("homeBtn").addEventListener("click", () => window.scrollTo({top:0,behavior:"smooth"}));
$("searchBtn").addEventListener("click", () => $("searchInput").focus());
$("profileBtn").addEventListener("click", () => $("profileInfo").scrollIntoView({behavior:"smooth"}));

supabase.auth.onAuthStateChange((_event, session) => {
  currentUser = session?.user || null;
  $("authCard").classList.toggle("hidden", !!currentUser);
  $("appArea").classList.toggle("hidden", !currentUser);
  $("accountLabel").textContent = currentUser ? currentUser.email : "Your social space";
  if (currentUser) {
    $("profileInfo").textContent = "Signed in as " + currentUser.email;
    loadFeed();
  }
});

updateScreen();
</script>
</body>
</html>
